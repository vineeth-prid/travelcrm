name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelcrm
          POSTGRES_PASSWORD: travelcrm
          POSTGRES_DB: travelcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travelcrm:travelcrm@localhost:5432/travelcrm_test?schema=public
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit checks
        run: |
          npm run check -w @travel-crm/api
          npm run check -w @travel-crm/web

      - name: Apply migrations
        run: npm run db:deploy

      - name: Build
        run: npm run build
