name: travel-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelcrm}
      POSTGRES_DB: ${POSTGRES_DB:-travelcrm}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-travelcrm} -d ${POSTGRES_DB:-travelcrm}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Prepared for queues / caching. Nothing connects to it yet.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stores generated quote PDFs.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Docker Desktop resolves host.docker.internal by itself; on Linux it does
    # not, and the Ollama server on the host would be unreachable without this.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-travelcrm}:${POSTGRES_PASSWORD:-travelcrm}@postgres:5432/${POSTGRES_DB:-travelcrm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-minimum-32-characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-log}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@travelcrm.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WEBHOOK_LOG_PAYLOADS: ${WEBHOOK_LOG_PAYLOADS:-false}
      INSTAGRAM_GRAPH_URL: ${INSTAGRAM_GRAPH_URL:-https://graph.instagram.com}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-v23.0}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_BUSINESS_ID: ${INSTAGRAM_BUSINESS_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # Where the links in notification emails point.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # An Ollama server on the host, reached from inside the container.
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-travel-crm}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      COMPANY_NAME: ${COMPANY_NAME:-Travel CRM}
      COMPANY_LOGO_PATH: ${COMPANY_LOGO_PATH:-}
      COMPANY_CONTACT: ${COMPANY_CONTACT:-}
      COMPANY_TAX_ID: ${COMPANY_TAX_ID:-}
      COMPANY_BANK_DETAILS: ${COMPANY_BANK_DETAILS:-}
      INVOICE_DUE_DAYS: ${INVOICE_DUE_DAYS:-14}
      INVOICE_DEFAULT_TAX_BPS: ${INVOICE_DEFAULT_TAX_BPS:-}
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/api/v1/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      API_INTERNAL_URL: http://api:3001/api/v1
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0}
      NEXT_PUBLIC_BUILD_NUMBER: ${NEXT_PUBLIC_BUILD_NUMBER:-docker}
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/sdk/src:/app/packages/sdk/src

volumes:
  postgres-data:
  redis-data:
  minio-data:
